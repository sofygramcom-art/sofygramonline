<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sofygram | بوابة المندوبين 💼</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --glow: #2ecc71; --gold: #ffd700; --bg: #050a14; --card: #121c2c; --red: #e74c3c; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; text-align: center; margin: 0; padding: 15px; }
        .card { background: var(--card); padding: 30px; border-radius: 30px; max-width: 500px; margin: 40px auto; border: 1px solid var(--gold); box-shadow: 0 0 25px rgba(255, 215, 0, 0.15); }
        
        h2 { color: var(--gold); margin-bottom: 25px; }
        
        input { width: 90%; padding: 15px; border-radius: 15px; border: 1px solid #333; background: #000; color: #fff; text-align: center; margin-bottom: 15px; font-size: 16px; outline: none; }
        input:focus { border-color: var(--gold); }
        
        .btn { padding: 15px; border-radius: 15px; border: none; cursor: pointer; font-weight: bold; font-size: 16px; width: 95%; margin-top: 10px; transition: 0.3s; }
        .btn-login { background: linear-gradient(45deg, var(--gold), #ff8c00); color: black; }
        .btn-logout { background: transparent; border: 1px solid var(--red); color: var(--red); padding: 8px; width: auto; font-size: 12px; margin-bottom: 20px; }
        
        .hidden { display: none !important; }

        /* تصميم الإحصائيات */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .stat-box { background: #1e293b; padding: 15px; border-radius: 15px; border: 1px dashed #555; }
        .stat-box h4 { margin: 0 0 5px 0; color: #aaa; font-size: 12px; }
        .stat-box p { margin: 0; font-size: 18px; font-weight: bold; }
        .total-box { grid-column: span 2; background: rgba(46, 204, 113, 0.1); border-color: var(--glow); }
        .total-box h4 { color: var(--glow); }

        /* تصميم قائمة الأطباء */
        .doc-item { background: #1a1a1a; padding: 12px; border-radius: 15px; margin-bottom: 10px; text-align: right; display: flex; justify-content: space-between; align-items: center; border-right: 5px solid #333; }
        .badge { padding: 4px 8px; border-radius: 8px; font-size: 11px; font-weight: bold; }
    </style>
</head>
<body>

    <!-- شاشة تسجيل الدخول -->
    <div class="card" id="loginSection">
        <i class="fas fa-briefcase" style="font-size: 50px; color: var(--gold); margin-bottom: 15px;"></i>
        <h2>بوابة المندوبين</h2>
        <p style="color: #888; font-size: 14px; margin-bottom: 20px;">الرجاء إدخال بياناتك للدخول إلى حسابك</p>
        
        <input type="text" id="mId" placeholder="رمز المندوب (مثال: M60)">
        <input type="password" id="mPass" placeholder="كلمة المرور">
        <button class="btn btn-login" onclick="loginMandoob()">تسجيل الدخول 🚀</button>
        <p id="errorMsg" style="color: var(--red); font-size: 13px; margin-top: 15px;" class="hidden">بيانات الدخول غير صحيحة!</p>
    </div>

    <!-- شاشة لوحة التحكم (الداشبورد) -->
    <div class="card hidden" id="dashboardSection" style="max-width: 600px;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h2 style="margin: 0;">مرحباً <span id="displayMandoobName"></span> 👋</h2>
            <button class="btn btn-logout" onclick="logoutMandoob()">خروج 🚪</button>
        </div>
        
        <div class="stats-grid" style="margin-top: 20px;">
            <div class="stat-box total-box">
                <h4>المستحقات المطلوبة للدفع الآن 💸</h4>
                <p style="color: var(--glow); font-size: 24px;"><span id="valBalance">0</span> دينار</p>
            </div>
            <div class="stat-box">
                <h4>إجمالي الأرباح الكلية</h4>
                <p style="color: var(--gold);"><span id="valTotalEarned">0</span> د.ع</p>
            </div>
            <div class="stat-box">
                <h4>تم استلامه سابقاً</h4>
                <p style="color: #aaa;"><span id="valPaid">0</span> د.ع</p>
            </div>
        </div>

        <h3 style="text-align: right; color: var(--gold); font-size: 16px; border-bottom: 1px solid #333; padding-bottom: 10px;">قائمة أطبائك المسجلين:</h3>
        <div id="doctorsList">
            <p style="color: #888; font-size: 13px;">جاري تحميل بيانات الأطباء...</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-app.js";
        import { getDatabase, ref, get, onValue } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-database.js";

        // المفاتيح الكاملة لضمان الاتصال
        const firebaseConfig = {
            apiKey: "AIzaSyA3BtNZYPLaDTEjuh0AjMp43RzRQGALFBU",
            authDomain: "sofygram-mobile-app.firebaseapp.com",
            databaseURL: "https://sofygram-mobile-app-default-rtdb.firebaseio.com",
            projectId: "sofygram-mobile-app",
            storageBucket: "sofygram-mobile-app.firebasestorage.app",
            messagingSenderId: "190753733711",
            appId: "1:190753733711:web:0ce4a97a2878120ff37e3a"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // التحقق مما إذا كان المندوب مسجل دخول مسبقاً
        let loggedInMandoob = sessionStorage.getItem('mandoob_logged_in');
        if(loggedInMandoob) {
            showDashboard(loggedInMandoob);
        }

        // دالة تسجيل الدخول
        window.loginMandoob = () => {
            let id = document.getElementById('mId').value.trim();
            let pass = document.getElementById('mPass').value.trim();
            let errorMsg = document.getElementById('errorMsg');

            if(!id || !pass) {
                errorMsg.innerText = "يرجى تعبئة الحقول أولاً!";
                errorMsg.classList.remove('hidden');
                return;
            }

            // البحث عن المندوب في قاعدة البيانات
            get(ref(db, 'mandoobs/' + id)).then((snapshot) => {
                if(snapshot.exists()) {
                    let data = snapshot.val();
                    if(data.password === pass) {
                        // الدخول ناجح
                        sessionStorage.setItem('mandoob_logged_in', id);
                        errorMsg.classList.add('hidden');
                        showDashboard(id);
                    } else {
                        // الباسوورد خطأ
                        errorMsg.innerText = "كلمة المرور غير صحيحة!";
                        errorMsg.classList.remove('hidden');
                    }
                } else {
                    // المندوب غير موجود
                    errorMsg.innerText = "هذا الرمز غير مسجل لدينا!";
                    errorMsg.classList.remove('hidden');
                }
            }).catch((error) => {
                alert("حدث خطأ في الاتصال بالسيرفر.");
            });
        };

        // دالة الخروج
        window.logoutMandoob = () => {
            sessionStorage.removeItem('mandoob_logged_in');
            document.getElementById('mId').value = "";
            document.getElementById('mPass').value = "";
            document.getElementById('dashboardSection').classList.add('hidden');
            document.getElementById('loginSection').classList.remove('hidden');
        };

        // دالة عرض الداشبورد وحساب الأرباح وعرض الاسم
        function showDashboard(mandoobId) {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('dashboardSection').classList.remove('hidden');

            // جلب الأرباح والمستحقات الخاصة بهذا المندوب مع اسمه الحقيقي
            onValue(ref(db, 'mandoobs/' + mandoobId), (snapshot) => {
                let paidAmount = 0;
                let realName = mandoobId; // الافتراضي هو الرمز

                if(snapshot.exists()) {
                    let data = snapshot.val();
                    paidAmount = data.paid_amount || 0;
                    
                    // إذا كان مسجل باسم حقيقي نستخدمه
                    if(data.name && data.name !== "بدون اسم") {
                        realName = data.name;
                    }
                }
                
                // عرض الاسم في الواجهة
                document.getElementById('displayMandoobName').innerText = realName;
                
                // جلب قائمة الأطباء لمعرفة من منهم "شهري"
                onValue(ref(db, 'users'), (usersSnapshot) => {
                    let usersData = usersSnapshot.val() || {};
                    let listHTML = "";
                    let greenDocsCount = 0;

                    for(let docId in usersData) {
                        let doc = usersData[docId];
                        
                        // إذا كان الطبيب مسجل باسم هذا المندوب
                        if(doc.mandoob_id === mandoobId) {
                            let statusText = doc.sub_status || 'انتظار';
                            let statusColor = "#e74c3c"; // أحمر (انتظار)
                            let badgeStyle = "background: rgba(231, 76, 60, 0.2); color: #e74c3c;";

                            if(statusText === 'تيست') {
                                statusColor = "#f1c40f"; // أصفر
                                badgeStyle = "background: rgba(241, 196, 15, 0.2); color: #f1c40f;";
                            } else if(statusText === 'شهري') {
                                statusColor = "#2ecc71"; // أخضر
                                badgeStyle = "background: rgba(46, 204, 113, 0.2); color: #2ecc71;";
                                greenDocsCount++;
                            }

                            listHTML += `
                            <div class="doc-item" style="border-right-color: ${statusColor}">
                                <div>
                                    <h4 style="margin: 0; font-size: 15px;">${doc.name || 'بدون اسم'}</h4>
                                    <p style="margin: 3px 0 0 0; font-size: 11px; color: #888;">${doc.type || 'غير محدد'}</p>
                                </div>
                                <div class="badge" style="${badgeStyle}">${statusText}</div>
                            </div>`;
                        }
                    }

                    if(listHTML === "") listHTML = "<p style='color:#555; font-size:13px;'>لم تقم بتسجيل أي عميل بعد.</p>";
                    document.getElementById('doctorsList').innerHTML = listHTML;

                    // حساب الأرقام وعرضها
                    let totalEarned = greenDocsCount * 5000;
                    let balance = totalEarned - paidAmount;

                    document.getElementById('valTotalEarned').innerText = totalEarned.toLocaleString();
                    document.getElementById('valPaid').innerText = paidAmount.toLocaleString();
                    document.getElementById('valBalance').innerText = balance.toLocaleString();
                });
            });
        }
    </script>
</body>
</html>
